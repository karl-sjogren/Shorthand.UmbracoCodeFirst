# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Keep the repository's .NET 10 dependencies on 10.x while allowing minor,
    # patch and security updates. Package consumers may still choose newer versions.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.OpenApi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Diagnostics.Testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http.Resilience"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.ServiceDiscovery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.TimeProvider.Testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
    groups:
      roslynator:
        patterns:
          - "Roslynator*"
      ms-codeanalysis:
        patterns:
          - "Microsoft.CodeAnalysis*"
      benchmark-dotnet:
        patterns:
          - "BenchmarkDotNet*"
      automapper:
        patterns:
          - "AutoMapper*"
      entityframework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore*"
      hangfire:
        patterns:
          - "Hangfire*"
      serilog:
        patterns:
          - "Serilog*"
      xunit:
        patterns:
          - "xunit*"
      fakeiteasy:
        patterns:
          - "FakeItEasy*"
      testable-io:
        patterns:
          - "TestableIO*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
