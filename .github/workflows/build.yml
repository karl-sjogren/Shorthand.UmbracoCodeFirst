name: 'Build and publish application'

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'copilot/**'
    paths-ignore:
      - 'README.md'
      - 'docs/*'
      - 'scripts/*'
      - '.vscode/*'

permissions:
  checks: write
  contents: write
  pull-requests: write
  actions: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PUBLISH_CODECOV: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/main')
  RUN_UMBRACO_INTEGRATION_TESTS: true

jobs:

  net-test:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal

    - name: Build .NET solution
      run: dotnet build --configuration Release --no-restore

    - name: Run .NET tests
      run: dotnet test --coverage --coverage-output-format cobertura --coverage-settings ./test/coverage.config --report-trx --no-build --configuration Release --no-progress

    - name: Run backoffice .NET tests
      run: dotnet test ./test/Shorthand.UmbracoCodeFirst.Backoffice.Tests/Shorthand.UmbracoCodeFirst.Backoffice.Tests.csproj --no-build --configuration Release --no-progress

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: net-test-results
        path: |
          ./**/*.trx
          ./**/*.cobertura.xml

  backoffice-client-test:
    name: Backoffice client tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        check-latest: true
        cache: npm
        cache-dependency-path: src/Shorthand.UmbracoCodeFirst.Backoffice/Client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Run Vitest tests
      run: npm test -- --reporter=default --reporter=junit --outputFile=vitest-results.xml --coverage --coverage.reporter=text --coverage.reporter=cobertura --coverage.reporter=lcov
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Build backoffice client
      run: npm run build
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Upload backoffice client test results
      uses: actions/upload-artifact@v7
      with:
        name: backoffice-client-results
        path: |
          src/Shorthand.UmbracoCodeFirst.Backoffice/Client/vitest-results.xml
          src/Shorthand.UmbracoCodeFirst.Backoffice/Client/coverage/cobertura-coverage.xml
          src/Shorthand.UmbracoCodeFirst.Backoffice/Client/coverage/lcov.info
        if-no-files-found: error

  test-and-coverage-results:
    name: Publish test and coverage results
    runs-on: ubuntu-latest

    needs: [ net-test, backoffice-client-test ]

    steps:
    # While we don't use sources directly in this job the test reporter wants to check
    # some files through git so we need the sources.
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Download .NET tests results
      uses: actions/download-artifact@v8
      with:
        name: net-test-results
        path: ./

    - name: Download backoffice client test results
      uses: actions/download-artifact@v8
      with:
        name: backoffice-client-results
        path: ./backoffice-client-results

    - name: Create history folder
      run: mkdir ./coverage-history
      working-directory: ./

    - name: Download historial coverage
      uses: dawidd6/action-download-artifact@v28
      with:
        workflow_conclusion: success
        branch: ${{ github.head_ref }}
        name: coverage-history
        path: ./coverage-history
        check_artifacts:  true
        search_artifacts: true
        if_no_artifact_found: ignore

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: './**/*.cobertura.xml;./**/cobertura-coverage.xml'
        targetdir: 'coverage-report'
        historydir: 'coverage-history'
        reporttypes: 'Html;MarkdownSummary;MarkdownDeltaSummary;Cobertura'
        assemblyfilters: '-xunit*'
        verbosity: 'Info'

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report

    - name: Upload backoffice client coverage
      uses: actions/upload-artifact@v7
      with:
        name: backoffice-client-coverage
        path: ./backoffice-client-results/coverage

    - name: Upload backoffice client test results
      uses: actions/upload-artifact@v7
      with:
        name: backoffice-client-test-results
        path: ./backoffice-client-results/vitest-results.xml

    - name: Publish backoffice client test summary
      shell: bash
      run: |
        {
          echo "## Backoffice client tests"
          echo
          echo "Vitest JUnit results and coverage are available in the \`backoffice-client-results\` and \`backoffice-client-coverage\` artifacts."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      # To save on uploads, only upload coverage from the main branches and PRs
      if: env.PUBLISH_CODECOV
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-report/Cobertura.xml

    - name: Upload coverage history
      uses: actions/upload-artifact@v7
      with:
        name: coverage-history
        path: coverage-history

    - name: Publish code coverage summary to run
      uses: LouisBrunner/checks-action@v3.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        conclusion: ${{ job.status }}
        name: 📝 Code coverage
        output: "{\"summary\":\"Summary of code coverage. For more detailed information, download the full artifact from the run.\"}"
        output_text_description_file: ./coverage-report/Summary.md

  net-build:
    name: .NET build
    runs-on: ubuntu-latest

    needs: [ net-test, backoffice-client-test ]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal

    - name: Publish application
      run: dotnet publish --output ./artifacts --configuration Release
      working-directory: ./

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: publish-artifacts
        path: ./artifacts/
        if-no-files-found: error
