name: 'Build and publish application'

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'copilot/**'
    paths-ignore:
      - 'README.md'
      - 'docs/*'
      - 'scripts/*'
      - '.vscode/*'

permissions:
  checks: write
  contents: write
  pull-requests: write
  actions: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PUBLISH_CODECOV: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/main')
  RUN_UMBRACO_INTEGRATION_TESTS: true

jobs:

  net-test:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal

    - name: Build .NET solution
      run: dotnet build --configuration Release --no-restore

    - name: Run .NET tests
      run: dotnet test --coverage --coverage-output-format cobertura --coverage-settings ./test/coverage.config --report-trx --no-build --configuration Release --no-progress

    - name: Run backoffice .NET tests
      run: dotnet test ./test/Shorthand.UmbracoCodeFirst.Backoffice.Tests/Shorthand.UmbracoCodeFirst.Backoffice.Tests.csproj --no-build --configuration Release --no-progress

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: net-test-results
        path: |
          ./**/*.trx
          ./**/*.cobertura.xml

  backoffice-client-test:
    name: Backoffice client tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        check-latest: true
        cache: npm
        cache-dependency-path: src/Shorthand.UmbracoCodeFirst.Backoffice/Client/package-lock.json

    - name: Install client dependencies
      run: npm ci --force
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Run Vitest tests
      run: npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile=vitest-results.xml --coverage
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Build backoffice client
      run: npm run build
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Upload backoffice client
      uses: actions/upload-artifact@v7
      with:
        name: backoffice-client
        path: ./src/Shorthand.UmbracoCodeFirst.Umbraco/wwwroot/App_Plugins/ShorthandUmbracoCodeFirstBackoffice

  test-and-coverage-results:
    name: Publish test and coverage results
    runs-on: ubuntu-latest

    needs: [ net-test, backoffice-client-test ]

    steps:
    # While we don't use sources directly in this job the test reporter wants to check
    # some files through git so we need the sources.
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Download .NET tests results
      uses: actions/download-artifact@v8
      with:
        name: net-test-results
        path: ./

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: './**/*.cobertura.xml;./**/cobertura-coverage.xml'
        targetdir: 'coverage-report'
        historydir: 'coverage-history'
        reporttypes: 'Html;MarkdownSummary;MarkdownDeltaSummary;Cobertura'
        assemblyfilters: '-xunit*'
        verbosity: 'Info'

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      # To save on uploads, only upload coverage from the main branches and PRs
      if: env.PUBLISH_CODECOV
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-report/Cobertura.xml

  net-build:
    name: .NET build
    runs-on: ubuntu-latest

    needs: [ net-test, backoffice-client-test ]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Download backoffice client
      uses: actions/download-artifact@v8
      with:
        name: backoffice-client
        path: ./src/Shorthand.UmbracoCodeFirst.Umbraco/wwwroot/App_Plugins/ShorthandUmbracoCodeFirstBackoffice

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal

    - name: Build solution
      run: dotnet build Shorthand.UmbracoCodeFirst.slnx --configuration Release

    - name: Pack projects
      run: |
        dotnet pack src/Shorthand.UmbracoCodeFirst/Shorthand.UmbracoCodeFirst.csproj --configuration Release --output artifacts --version-suffix alpha-${{ github.run_number }}
        dotnet pack src/Shorthand.UmbracoCodeFirst.Core/Shorthand.UmbracoCodeFirst.Core.csproj --configuration Release --output artifacts --version-suffix alpha-${{ github.run_number }}
        dotnet pack src/Shorthand.UmbracoCodeFirst.Backoffice/Shorthand.UmbracoCodeFirst.Backoffice.csproj --configuration Release --output artifacts --version-suffix alpha-${{ github.run_number }}
        dotnet pack src/Shorthand.UmbracoCodeFirst.SourceGenerators/Shorthand.UmbracoCodeFirst.SourceGenerators.csproj --configuration Release --output artifacts --version-suffix alpha-${{ github.run_number }}
        dotnet pack src/Shorthand.UmbracoCodeFirst.Analyzers/Shorthand.UmbracoCodeFirst.Analyzers.csproj --configuration Release --output artifacts --version-suffix alpha-${{ github.run_number }}

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: artifacts/*.nupkg

  publish:
    name: NuGet Publish
    needs: net-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          global.json
        sparse-checkout-cone-mode: false

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: ./artifacts/

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_PROFILE }}

    - name: Publish package to NuGet.org
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      working-directory: ./
