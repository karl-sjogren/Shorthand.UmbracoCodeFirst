name: '[Dependabot NPM and Yarn] Build Frontend'

on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/**'

jobs:
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:

    # This is needed to pass linting
    - name: Set GIT to use CRLF
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf

    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Setup Node.js environment
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        check-latest: true
        cache: npm
        cache-dependency-path: src/Shorthand.UmbracoCodeFirst.Backoffice/Client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Run Vitest tests
      run: npm test -- --reporter=default --reporter=junit --outputFile=vitest-results.xml --coverage --coverage.reporter=text --coverage.reporter=cobertura --coverage.reporter=lcov
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [ frontend-test ]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Setup Node.js environment
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        check-latest: true
        cache: npm
        cache-dependency-path: src/Shorthand.UmbracoCodeFirst.Backoffice/Client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client

    - name: Build backoffice client
      run: npm run build
      working-directory: ./src/Shorthand.UmbracoCodeFirst.Backoffice/Client
